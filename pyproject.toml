[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devlock"
dynamic = ["version"]
description = "Keep parallel coding-agent sessions (Claude Code, Codex, Cursor) off the same adb/fastboot test device"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["adb", "fastboot", "android", "device", "lock", "claude-code", "codex", "cursor", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/murano500k/devlock"
Documentation = "https://github.com/murano500k/devlock/tree/main/docs"
Issues = "https://github.com/murano500k/devlock/issues"

[project.scripts]
devlock = "devlock:entry"

[tool.hatch.version]
path = "src/devlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/devlock"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "devlock/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "SKILL.md", "README.md", "LICENSE", "docs", "tests", "devlock", "install.sh"]
